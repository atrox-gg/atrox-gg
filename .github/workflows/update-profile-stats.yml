name: Update profile visuals

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - assets/ATROX.png
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Create a rounded, full-resolution banner copy
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageChops, ImageDraw
          from pathlib import Path

          source = Path("assets/ATROX.png")
          output = Path("assets/ATROX-rounded.png")
          image = Image.open(source).convert("RGBA")
          width, height = image.size

          # Antialiased corner mask; preserve the source dimensions and RGB artwork.
          scale = 4
          radius = round(height * 0.085)
          mask = Image.new("L", (width * scale, height * scale), 0)
          draw = ImageDraw.Draw(mask)
          draw.rounded_rectangle(
              (0, 0, width * scale - 1, height * scale - 1),
              radius=radius * scale,
              fill=255,
          )
          mask = mask.resize((width, height), Image.Resampling.LANCZOS)
          image.putalpha(ImageChops.multiply(image.getchannel("A"), mask))
          image.save(output, format="PNG", optimize=True)
          print(f"Created {output}: {width}x{height}")
          PY

      - name: Generate dark GitHub statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: "username=atrox-gg&theme=dark_github&hide_border=true&hide_title=true&show_icons=false&hide_rank=true&card_width=360"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: v2.2.1
          fail_on_error: true

      - name: Generate light GitHub statistics
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: "username=atrox-gg&theme=default&hide_border=true&hide_title=true&show_icons=false&hide_rank=true&card_width=360"
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: v2.2.1
          fail_on_error: true

      - name: Generate dark top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: "username=atrox-gg&layout=donut&langs_count=5&theme=dark_github&hide_border=true&hide_title=true&card_width=360"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: v2.2.1
          fail_on_error: true

      - name: Generate light top languages
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: "username=atrox-gg&layout=donut&langs_count=5&theme=default&hide_border=true&hide_title=true&card_width=360"
          path: profile/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: v2.2.1
          fail_on_error: true

      - name: Keep both language cards aligned until data exists
        shell: bash
        run: |
          if grep -q "No languages data" profile/top-langs.svg; then
            cat > profile/top-langs.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="360" height="165" viewBox="0 0 360 165" role="img" aria-labelledby="title desc">
            <title id="title">Top languages</title>
            <desc id="desc">No language data is available yet. This card will show programming languages when code repositories are available.</desc>
            <rect width="360" height="165" rx="5" fill="#0D1117"/>
            <circle cx="78" cy="82" r="35" fill="none" stroke="#21262D" stroke-width="15"/>
            <circle cx="78" cy="82" r="35" fill="none" stroke="#30363D" stroke-width="2" stroke-dasharray="3 6"/>
            <text x="132" y="77" fill="#C9D1D9" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">No language data yet</text>
            <text x="132" y="98" fill="#8B949E" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11">Appears when code is published</text>
          </svg>
          SVG
          fi
          if grep -q "No languages data" profile/top-langs-light.svg; then
            cat > profile/top-langs-light.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="360" height="165" viewBox="0 0 360 165" role="img" aria-labelledby="title desc">
            <title id="title">Top languages</title>
            <desc id="desc">No language data is available yet. This card will show programming languages when code repositories are available.</desc>
            <rect width="360" height="165" rx="5" fill="#FFFFFF"/>
            <circle cx="78" cy="82" r="35" fill="none" stroke="#EAEEF2" stroke-width="15"/>
            <circle cx="78" cy="82" r="35" fill="none" stroke="#D0D7DE" stroke-width="2" stroke-dasharray="3 6"/>
            <text x="132" y="77" fill="#24292F" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">No language data yet</text>
            <text x="132" y="98" fill="#656D76" font-family="Segoe UI, Ubuntu, sans-serif" font-size="11">Appears when code is published</text>
          </svg>
          SVG
          fi

      - name: Commit generated profile visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in profile/stats-dark.svg profile/streak-light.svg profile/streak-dark.svg profile/top-langs-dark.svg; do
            if [ -f "$path" ]; then
              git rm -f "$path"
            fi
          done
          git add assets/ATROX-rounded.png profile/stats.svg profile/stats-light.svg profile/top-langs.svg profile/top-langs-light.svg
          if git diff --cached --quiet; then
            echo "No changes in profile visuals."
            exit 0
          fi
          git commit -m "chore: update profile visuals"
          git push
