<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Telegram, GitHub, TikTok, Reddit, Spotify, SoundCloud и Pinterest.">
  <meta name="theme-color" content="#08090B">
  <title>ATROX</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">
  <link rel="preload" as="image" href="./assets/img/ascii.png" type="image/png" fetchpriority="high">
  <script>
    (() => {
      const root = document.documentElement;
      window.__atroxSplashStartedAt = performance.now();
      root.classList.add('splash-enabled', 'splash-active');
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <link rel="stylesheet" href="./assets/css/splash.css">
  <script src="./assets/javascript/script.js" defer></script>
  <script src="./assets/javascript/splash.js" defer></script>
</head>
<body>
  <div class="splash" data-splash aria-labelledby="splash-title">
    <div class="splash__content">
      <h1 class="visually-hidden" id="splash-title">ATROX</h1>
      <img
        class="splash__image"
        src="./assets/img/knight_on_horse_ascii_transparent.png"
        width="1508"
        height="1563"
        alt="ASCII-арт рыцаря на коне"
        decoding="async"
        fetchpriority="high"
      >
      <div class="splash__progress" aria-hidden="true">
        <span class="splash__progress-fill" data-splash-progress></span>
      </div>
    </div>
  </div>

  <div class="site-content" id="site-content">
    <a class="skip-link" href="#resources" data-i18n="a11y.skip">Перейти к ресурсам</a>

    <header class="site-header">
      <nav class="site-nav" aria-label="Навигация" data-i18n-aria-label="nav.label">
        <a class="site-nav__brand" href="#resources" aria-label="ATROX — к ресурсам" data-i18n-aria-label="brand.resources">ATROX</a>
        <div class="site-nav__links">
          <a href="#resources" aria-current="page" data-i18n="nav.resources">РЕСУРСЫ</a>
          <button
            class="site-nav__language"
            type="button"
            data-language-toggle
            data-current-language="ru"
            aria-pressed="false"
            aria-label="Текущий язык: русский. Переключить на английский"
            data-i18n-aria-label="language.label"
            disabled
          >
            <span class="language-option" data-language-option="ru">RU</span>
            <span class="language-separator" aria-hidden="true">/</span>
            <span class="language-option" data-language-option="en">EN</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="site-main" id="resources" tabindex="-1">
      <section class="resources-section" aria-labelledby="resources-title">
        <div class="resources-content">
          <h1 class="resources-title" id="resources-title" data-i18n="resources.title">Ресурсы</h1>

          <h2 class="resource-group-title" id="primary-resources-title" data-i18n="resources.primary">Основные ресурсы</h2>
          <ul class="resource-list resource-list--primary" aria-labelledby="primary-resources-title">
            <li>
              <a href="https://t.me/atroxg" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/telegram.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">Telegram</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://github.com/atrox-gg" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/github.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">GitHub</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://www.tiktok.com/@atrox.gg" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/tiktok.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">TikTok</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ul>

          <h2 class="resource-group-title resource-group-title--secondary" id="secondary-resources-title" data-i18n="resources.secondary">Другие профили</h2>
          <ul class="resource-list resource-list--secondary" aria-labelledby="secondary-resources-title">
            <li>
              <a href="https://www.reddit.com/user/atrox_gg" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/reddit.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">Reddit</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://open.spotify.com/user/31o5i6hqhnkf5zyzcs2wylxljnry" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/spotify.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">Spotify</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://soundcloud.com/atrox-215396701" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/soundcloud.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">SoundCloud</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://www.pinterest.com/atrox_explorer/" target="_blank" rel="noopener noreferrer">
                <img class="resource-icon" src="./assets/img/icon/pinterest.svg" width="24" height="24" alt="" aria-hidden="true">
                <span class="resource-name">Pinterest</span>
                <span class="resource-arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ul>

          <details class="resource-more">
            <summary>
              <span class="resource-more__label" data-i18n="resources.more.show">Дополнительные ресурсы</span>
              <span class="resource-more__indicator" aria-hidden="true">+</span>
            </summary>
            <ul class="resource-list resource-list--secondary" aria-label="Профиль Lolzteam" data-i18n-aria-label="resources.lolzteam">
              <li>
                <a href="https://lolz.team/members/11060245/" target="_blank" rel="noopener noreferrer">
                  <img class="resource-icon" src="./assets/img/icon/lolzteam.svg" width="24" height="24" alt="" aria-hidden="true">
                  <span class="resource-name">Lolzteam</span>
                  <span class="resource-arrow" aria-hidden="true">↗</span>
                </a>
              </li>
            </ul>
          </details>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
